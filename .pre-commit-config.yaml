repos:
  - repo: local
    hooks:
      - id: textlint
        name: Validate prose with textlint
        entry: ./node_modules/.bin/textlint
        language: system
        files: \.md$
      - id: markdownlint
        name: Validate Markdown
        entry: ./node_modules/.bin/markdownlint-cli2
        language: system
        files: \.md$
